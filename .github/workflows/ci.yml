# Builds ClickHouse and InodeDB from the submodules, starts the local stack, and runs BigHouse's suites.
# A cold ClickHouse build takes hours, so ccache persists between runs. The stateless parity run is opt-in.
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      parity:
        description: Also run ClickHouse's stateless tests on both metadata types
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 9G
      CCACHE_COMPRESS: "1"
      # Release keeps the build directory within a hosted runner's disk.
      BUILD_TYPE: Release
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Check out the submodules
        run: |
          git submodule update --init --depth 1 ClickHouse inodedb
          (cd ClickHouse && ./contrib/update-submodules.sh)

      - name: Install the toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y ninja-build ccache

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            inodedb/target
          key: cargo-${{ hashFiles('inodedb/Cargo.lock') }}

      - name: Build InodeDB
        run: scripts/inodedb-build

      - name: Build ClickHouse
        run: |
          scripts/clickhouse-build clickhouse unit_tests_dbms || (tail -100 build/build.log; exit 1)
          ccache --show-stats

      - name: Start s3proxy and InodeDB
        run: scripts/dev-up

      - name: Metadata unit tests
        run: |
          mkdir -p tmp && cd tmp
          INODEDB_TEST_ENDPOINT=127.0.0.1:7070 INODEDB_TEST_KEY=$(cat ../.dev/inodedb/admin.key) \
            ../build/src/unit_tests_dbms --gtest_filter='Metadata/*'

      - name: Features
        run: python3 tests/features.py

      - name: Fence
        run: python3 tests/fence.py

      - name: Replicas
        run: python3 tests/replicas.py

      - name: Crash
        run: python3 tests/crash.py 20

      - name: Demo end to end
        run: python3 demo/e2e.py

      - name: Stateless parity
        if: ${{ inputs.parity }}
        run: python3 tests/parity.py --jobs 4

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/build.log
            .dev/servers/*/log
            .dev/parity/*/clickhouse-test.log
            .dev/parity/diff.json
            .dev/inodedb/server.log
          if-no-files-found: ignore
